name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: scripts/check-firstmate-pristine.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # Firstmate's markdown backlog CLI, used by the vendored scripts and tests.
      - run: npm install --global tasks-axi@0.2.6
      - run: git config --global user.email ci@amun.invalid && git config --global user.name "Amun CI"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run
      - run: npm run build -w @amun/ui
