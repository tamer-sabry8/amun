name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, "feat/m0-*", "feat/m1-*"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run --coverage
      - run: pnpm --filter @amun/desktop exec install-electron
      - run: pnpm exec electron-rebuild -m runtime/terminal -v 45.2.3 -w node-pty -f
      - run: pnpm database:stage
      - run: pnpm test:e2e
      - name: Preserve failed Electron acceptance images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-acceptance
          path: test-results/
          retention-days: 3
      - run: pnpm test:runtime
      - run: pnpm package
      - run: command -v tmux || brew install tmux
      - run: pnpm test:tmux
      - run: pnpm test:firstmate
      - run: node scripts/firstmate-permissions-proof.ts
      - run: node scripts/firstmate-permissions-proof.ts --packaged
      - run: node scripts/tmux-observe-proof.ts
      - run: pnpm test:packaged
