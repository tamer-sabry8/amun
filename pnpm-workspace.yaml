packages:
  - apps/*
  - packages/*
  - runtime/*
allowBuilds:
  better-sqlite3: true
  node-pty: true
  electron: true
  "@google/genai": true
  protobufjs: true
minimumReleaseAgeExclude:
  - electron@45.2.3
  - vite@8.3.6
  - msw@3.0.4
publicHoistPattern:
  - electron
overrides:
  "@axe-core/playwright>playwright-core": 1.64.1
